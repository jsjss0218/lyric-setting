<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찬양 가사 정리 · 프로프리젠터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface2: #fafbfc;
    --border: #e3e6ea;
    --border-strong: #d0d4da;
    --point: #2563c9;          /* 한국 서비스에서 익숙한 블루 포인트 */
    --point-dark: #1d4ed8;
    --point-soft: #eaf1fc;
    --text: #1a1a1a;            /* 본문 검정 */
    --text-sub: #4b5159;
    --text-dim: #8b9098;
    --verse:  #2563c9;
    --chorus: #d97706;
    --bridge: #059669;
    --pre:    #7c3aed;
    --tag:    #dc2626;
    --etc:    #6b7280;
    --font: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 18px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo::before {
    content: "🎵";
    font-size: 18px;
  }

  .logo-sub {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
    padding-left: 12px;
    border-left: 1px solid var(--border);
  }

  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 59px);
  }

  /* ── 카드 공통 ── */
  .left-panel, .right-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
  }

  .panel-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }

  .btn-clear {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sub);
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-clear:hover { color: var(--tag); border-color: var(--tag); background: #fff5f5; }

  textarea {
    flex: 1;
    background: var(--surface);
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.9;
    padding: 18px;
    resize: none;
    font-weight: 400;
  }
  textarea::placeholder {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.9;
  }

  /* 섹션 태그 버튼 */
  .hints {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .hint-label {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
    margin-right: 2px;
  }
  .tag-hint {
    font-size: 13px;
    font-weight: 500;
    padding: 5px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    background: #fff;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-sub);
  }
  .tag-hint:hover { background: var(--point-soft); border-color: var(--point); color: var(--point); }

  .tag-custom-form {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .tag-custom-input {
    width: 110px;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    background: #fff;
    color: var(--text);
    font-family: var(--font);
    outline: none;
  }
  .tag-custom-input:focus { border-color: var(--point); }
  .tag-custom-input::placeholder { color: var(--text-dim); }
  .btn-tag-add {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--point);
    border: none;
    border-radius: 16px;
    padding: 5px 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-tag-add:hover { background: var(--point-dark); }

  /* 사용자 프리셋 태그 */
  .tag-hint.tag-custom {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding-right: 6px;
  }
  .tag-del {
    font-size: 12px;
    line-height: 1;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 3px;
    border-radius: 50%;
  }
  .tag-del:hover { color: #fff; background: var(--tag); }

  /* ── 오른쪽 패널 ── */
  .right-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    gap: 12px;
    flex-wrap: wrap;
  }
  .options-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .option-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .option-toggle input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--point);
    cursor: pointer;
  }
  .option-toggle span {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-sub);
  }
  .lines-select {
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
  }
  .lines-select:focus { border-color: var(--point); }

  .btn-copy-all {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--point);
    border: none;
    border-radius: 7px;
    padding: 8px 18px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-copy-all:hover { background: var(--point-dark); }

  .action-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-export {
    font-size: 13px;
    font-weight: 700;
    color: var(--point);
    background: #fff;
    border: 1px solid var(--point);
    border-radius: 7px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-export:hover { background: var(--point-soft); }

  /* PPTX 드롭다운 */
  .pptx-wrap { position: relative; }
  .pptx-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    z-index: 50;
    overflow: hidden;
    min-width: 230px;
  }
  .pptx-menu.open { display: block; }
  .pptx-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: #fff;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s;
  }
  .pptx-menu button:hover { background: var(--point-soft); }
  .pptx-menu button:not(:last-child) { border-bottom: 1px solid var(--border); }
  .pptx-dot {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .pptx-note {
    padding: 8px 16px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    border-top: 1px solid var(--border);
  }

  /* 송폼 입력 바 */
  .songform-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--point-soft);
  }
  .songform-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--point);
    white-space: nowrap;
  }
  .songform-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 7px 12px;
    outline: none;
  }
  .songform-input:focus { border-color: var(--point); }
  .songform-input::placeholder { color: var(--text-dim); font-weight: 400; letter-spacing: 0; }
  .songform-status {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .songform-status.ok { color: var(--bridge); }
  .songform-status.warn { color: var(--tag); }

  .output-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
  }
  .empty-icon { font-size: 40px; opacity: 0.4; }
  .empty-text {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 400;
  }

  /* ── 섹션 블록 ── */
  .section-block {
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    background: #eef0f3;
    color: var(--etc);
  }
  .section-label.verse  { background: #eaf1fc; color: var(--verse); }
  .section-label.chorus { background: #fef3e2; color: var(--chorus); }
  .section-label.bridge { background: #e6f7f0; color: var(--bridge); }
  .section-label.pre    { background: #f3ebfd; color: var(--pre); }
  .section-label.tag    { background: #fdeaea; color: var(--tag); }
  .section-label.intro,
  .section-label.outro,
  .section-label.other  { background: #eef0f3; color: var(--etc); }

  .btn-copy-section {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sub);
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-copy-section:hover { color: var(--point); border-color: var(--point); background: var(--point-soft); }
  .btn-copy-section.copied { color: #fff; background: var(--bridge); border-color: var(--bridge); }

  .slide-group {
    padding: 12px 14px;
    background: var(--surface);
  }

  .slide {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 8px;
    position: relative;
  }
  .slide:last-child { margin-bottom: 0; }

  .slide-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    position: absolute;
    top: 8px;
    right: 12px;
  }

  .slide-line {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.9;
    color: var(--text);
  }

  .slide-divider {
    border: none;
    border-top: 1px dashed var(--border-strong);
    margin: 8px 0;
  }

  /* 상태 바 */
  .status-bar {
    border-top: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    gap: 18px;
    align-items: center;
    background: var(--surface2);
  }
  .stat {
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 500;
  }
  .stat span {
    color: var(--point);
    font-weight: 700;
    margin-left: 4px;
  }

  /* 스크롤바 */
  .output-area::-webkit-scrollbar { width: 8px; }
  .output-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; height: auto; gap: 12px; }
    .left-panel { min-height: 42vh; }
    .right-panel { min-height: 50vh; }
    header { padding: 14px 18px; flex-wrap: wrap; }
    .logo-sub { padding-left: 0; border-left: none; }
  }

  /* ── 라이브러리 ── */
  .lib-bar {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: #f0f4ff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lib-title-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    padding: 7px 12px;
    outline: none;
  }
  .lib-title-input:focus { border-color: var(--point); }
  .lib-title-input::placeholder { color: var(--text-dim); font-weight: 400; }
  .btn-lib-save {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: #4f7ef8;
    border: none;
    border-radius: 7px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-lib-save:hover { background: #3b63d4; }
  .btn-lib-open {
    font-size: 13px;
    font-weight: 700;
    color: #4f7ef8;
    background: #fff;
    border: 1px solid #4f7ef8;
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-lib-open:hover { background: #f0f4ff; }

  /* 라이브러리 드로어 */
  .lib-drawer {
    display: none;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
    background: #fff;
    max-height: 280px;
    overflow: hidden;
  }
  .lib-drawer.open { display: flex; }
  .lib-drawer-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .lib-search {
    flex: 1;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 6px 11px;
    outline: none;
  }
  .lib-search:focus { border-color: var(--point); }
  .lib-search::placeholder { color: var(--text-dim); }
  .lib-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .lib-list {
    overflow-y: auto;
    flex: 1;
  }
  .lib-list::-webkit-scrollbar { width: 6px; }
  .lib-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .lib-item {
    display: flex;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    transition: background 0.1s;
  }
  .lib-item:last-child { border-bottom: none; }
  .lib-item:hover { background: var(--point-soft); }
  .lib-item-title {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lib-item-date {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .btn-lib-load {
    font-size: 12px;
    font-weight: 600;
    color: var(--point);
    background: var(--point-soft);
    border: 1px solid var(--point);
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-lib-load:hover { background: var(--point); color: #fff; }
  .btn-lib-del {
    font-size: 12px;
    font-weight: 600;
    color: var(--tag);
    background: #fff5f5;
    border: 1px solid var(--tag);
    border-radius: 5px;
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-lib-del:hover { background: var(--tag); color: #fff; }
  .lib-empty {
    padding: 28px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* 상태바 내보내기/가져오기 */
  .stat-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .btn-stat-action {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-sub);
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    padding: 3px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-stat-action:hover { border-color: var(--point); color: var(--point); }

</style>
</head>
<body>

<header>
  <div class="logo">찬양 가사 정리</div>
  <div class="logo-sub">프로프리젠터 송폼 분류 · 맑은 고딕 11pt 복사</div>
</header>

<div class="main">

  <!-- LEFT: INPUT -->
  <div class="left-panel">
    <!-- 라이브러리 바 -->
    <div class="lib-bar">
      <input id="libTitleInput" class="lib-title-input" placeholder="곡 제목 입력 후 저장">
      <button class="btn-lib-save" onclick="libSave()">저장</button>
      <button class="btn-lib-open" onclick="libToggle()" id="btnLibOpen">라이브러리</button>
    </div>
    <!-- 라이브러리 드로어 -->
    <div class="lib-drawer" id="libDrawer">
      <div class="lib-drawer-head">
        <input id="libSearch" class="lib-search" placeholder="곡 제목 검색..." oninput="libRender()">
        <span class="lib-count" id="libCount"></span>
      </div>
      <div class="lib-list" id="libList"></div>
    </div>
    <div class="panel-header">
      <span class="panel-title">가사 입력</span>
      <button class="btn-clear" onclick="clearInput()">전체 지우기</button>
    </div>
    <textarea id="inputArea" placeholder="여기에 가사를 붙여넣으세요.

섹션은 < > 로 구분합니다:
<A>  <B>  <C>
<후렴>  <간주>  <브릿지>
<Verse 1>  <Chorus>

각 < > 가 하나의 섹션이 되고,
< > 표기는 복사 결과에서 자동으로 제거됩니다.

오른쪽 송폼 칸에 A-A-B-C 처럼 입력하면
그 순서대로 가사가 펼쳐집니다." oninput="parse()"></textarea>
    <div class="hints">
      <span class="hint-label">섹션 추가</span>
      <span class="tag-hint v" onclick="insertTag('<A>')">&lt;A&gt;</span>
      <span class="tag-hint c" onclick="insertTag('<B>')">&lt;B&gt;</span>
      <span class="tag-hint b" onclick="insertTag('<C>')">&lt;C&gt;</span>
      <span class="tag-hint p" onclick="insertTag('<후렴>')">&lt;후렴&gt;</span>
      <span class="tag-hint v" onclick="insertTag('<간주>')">&lt;간주&gt;</span>
      <span id="customTagList"></span>
      <span class="tag-custom-form">
        <input id="customTagInput" class="tag-custom-input" placeholder="프리셋 이름" onkeydown="if(event.key==='Enter'){event.preventDefault();addPreset();}">
        <button class="btn-tag-add" onclick="addPreset()">프리셋 추가</button>
      </span>
    </div>
  </div>

  <!-- RIGHT: OUTPUT -->
  <div class="right-panel">
    <div class="right-top">
      <div class="options-row">
        <label class="option-toggle">
          <input type="checkbox" id="twoLineMode" checked onchange="parse()">
          <span>2줄 슬라이드</span>
        </label>
        <select class="lines-select" id="lineCount" onchange="parse()">
          <option value="1">1줄/슬라이드</option>
          <option value="2" selected>2줄/슬라이드</option>
          <option value="3">3줄/슬라이드</option>
          <option value="4">4줄/슬라이드</option>
        </select>
      </div>
      <div class="action-buttons">
        <button class="btn-export" onclick="exportTxt(this)" title="텍스트 파일로 저장">TXT</button>
        <button class="btn-export" onclick="exportWord(this)" title="Word 파일로 저장">Word</button>
        <div class="pptx-wrap">
          <button class="btn-export" onclick="togglePptxMenu(event)" title="PPTX로 저장">PPTX ▾</button>
          <div class="pptx-menu" id="pptxMenu">
            <button onclick="exportPptx('green')">
              <span class="pptx-dot" style="background:#00ff00;"></span>
              투명배경 (녹색 크로마키)
            </button>
            <button onclick="exportPptx('black')">
              <span class="pptx-dot" style="background:#000;border:1px solid #555;"></span>
              검정배경 · 흰 글씨 가운데
            </button>
            <div class="pptx-note">슬라이드당 2줄 고정 · 16:9 · 맑은 고딕</div>
          </div>
        </div>
        <button class="btn-copy-all" onclick="copyAll()">전체 복사</button>
      </div>
    </div>
    <div class="songform-bar">
      <span class="songform-label">송폼</span>
      <input id="songFormInput" class="songform-input" placeholder="예: A-A-B-C (비우면 입력한 순서대로)" oninput="parse()">
      <span id="songFormStatus" class="songform-status"></span>
    </div>
    <div class="output-area" id="outputArea">
      <div class="empty-state">
        <div class="empty-icon">🎵</div>
        <div class="empty-text">가사를 입력하면 자동으로 정리됩니다</div>
      </div>
    </div>
    <div class="status-bar" id="statusBar" style="display:none;">
      <div class="stat">섹션<span id="statSections">0</span></div>
      <div class="stat">슬라이드<span id="statSlides">0</span></div>
      <div class="stat">총 줄<span id="statLines">0</span></div>
      <div class="stat-actions">
        <button class="btn-stat-action" onclick="libExportJson()">라이브러리 내보내기</button>
        <label class="btn-stat-action" style="cursor:pointer;">라이브러리 가져오기
          <input type="file" accept=".json" style="display:none;" onchange="libImportJson(this)">
        </label>
      </div>
    </div>
  </div>

</div>

<script>
// ── SECTION DETECTION ──
const SECTION_PATTERNS = [
  // Korean — [ ] 또는 < > 또는 태그 없이
  { re: /^[<\[]?(절|verse)\s*(\d*)[>\]]?$/i,           type: 'verse',  labelFn: m => `Verse${m[2] ? ' '+m[2] : ''}` },
  { re: /^[<\[]?(후렴|chorus|refrain)[>\]]?$/i,          type: 'chorus', labelFn: () => 'Chorus' },
  { re: /^[<\[]?(브릿지|bridge)[>\]]?$/i,               type: 'bridge', labelFn: () => 'Bridge' },
  { re: /^[<\[]?(프리코러스|pre.?chorus)[>\]]?$/i,       type: 'pre',    labelFn: () => 'Pre-Chorus' },
  { re: /^[<\[]?(태그|tag)[>\]]?$/i,                    type: 'tag',    labelFn: () => 'Tag' },
  { re: /^[<\[]?(인트로|intro)[>\]]?$/i,                type: 'intro',  labelFn: () => 'Intro' },
  { re: /^[<\[]?(아웃트로|outro|ending)[>\]]?$/i,       type: 'outro',  labelFn: () => 'Outro' },
  // English — [ ] form
  { re: /^[<\[](verse\s*\d*)[>\]]$/i,                   type: 'verse',  labelFn: m => m[1].replace(/^\w/, c=>c.toUpperCase()) },
  { re: /^[<\[](chorus)[>\]]$/i,                         type: 'chorus', labelFn: () => 'Chorus' },
  { re: /^[<\[](bridge)[>\]]$/i,                         type: 'bridge', labelFn: () => 'Bridge' },
  { re: /^[<\[](pre.?chorus)[>\]]$/i,                    type: 'pre',    labelFn: () => 'Pre-Chorus' },
  { re: /^[<\[](tag)[>\]]$/i,                            type: 'tag',    labelFn: () => 'Tag' },
  { re: /^[<\[](intro)[>\]]$/i,                          type: 'intro',  labelFn: () => 'Intro' },
  { re: /^[<\[](outro|ending)[>\]]$/i,                   type: 'outro',  labelFn: () => 'Outro' },
];

// 가사 줄에 남아있는 <...> 인라인 태그 제거
function stripAngleTags(line) {
  return line.replace(/<[^>]*>/g, '').trim();
}

function detectSection(line) {
  const t = line.trim();
  for (const p of SECTION_PATTERNS) {
    const m = t.match(p.re);
    if (m) return { type: p.type, label: p.labelFn(m) };
  }
  // 폴백: <A>, <B>, <간주> 등 꺾쇠로 감싼 짧은 라벨도 섹션으로 인식
  const angle = t.match(/^<([^>]{1,20})>$/);
  if (angle) {
    return { type: 'other', label: angle[1].trim() };
  }
  return null;
}

function parseSections(raw) {
  const rawLines = raw.split('\n');
  const sections = [];
  let current = null;

  function lastGroup() { return current.groups[current.groups.length - 1]; }

  function pushCurrent() {
    if (current) {
      current.groups = current.groups.filter(g => g.length > 0);
      if (current.groups.length > 0) sections.push(current);
    }
    current = null;
  }

  for (let i = 0; i < rawLines.length; i++) {
    const trimmed = rawLines[i].trim();
    const detected = detectSection(trimmed);

    if (detected) {
      // 새 섹션 헤더 < > 또는 [ ]
      pushCurrent();
      current = { ...detected, explicit: true, groups: [[]] };
    } else if (trimmed === '') {
      if (current) {
        if (current.explicit) {
          // 명시적 섹션 안의 빈 줄 → 섹션은 유지, 슬라이드(칸) 구분만
          if (lastGroup().length > 0) current.groups.push([]);
        } else {
          // 섹션 태그 없이 입력된 경우 → 빈 줄을 섹션 경계로
          if (lastGroup().length > 0) {
            const nextContent = rawLines.slice(i+1).find(l => l.trim() !== '');
            if (nextContent && !detectSection(nextContent.trim())) pushCurrent();
          }
        }
      }
    } else {
      if (!current) {
        const autoNum = sections.filter(s => !s.explicit).length + 1;
        current = { type: 'other', label: `Section ${autoNum}`, explicit: false, groups: [[]] };
      }
      const cleaned = stripAngleTags(trimmed);
      if (cleaned) lastGroup().push(cleaned);
    }
  }
  pushCurrent();
  return sections;
}

// 섹션을 슬라이드 배열로 변환 (그룹 경계는 항상 슬라이드 분리, 그 안에서 linesPerSlide로 분할)
function sectionSlides(sec, linesPerSlide) {
  const slides = [];
  for (const group of sec.groups) {
    for (let i = 0; i < group.length; i += linesPerSlide) {
      slides.push(group.slice(i, i + linesPerSlide));
    }
  }
  return slides;
}

// ── 송폼(곡 구성) 적용 ──
function normalizeLabel(s) {
  return s.trim().toLowerCase().replace(/\s+/g, '');
}

// 송폼 토큰 하나에 해당하는 섹션 찾기
function findSectionByToken(sections, token) {
  const t = normalizeLabel(token);
  if (!t) return null;
  // 1) 표시 라벨과 직접 매칭 (A, B, Chorus 등)
  let found = sections.find(s => normalizeLabel(s.label) === t);
  if (found) return found;
  // 2) 별칭 정규화 후 매칭 (후렴 → Chorus, verse1 → Verse 1 등)
  const det = detectSection('<' + token + '>');
  if (det) {
    found = sections.find(s => normalizeLabel(s.label) === normalizeLabel(det.label));
    if (found) return found;
  }
  return null;
}

// 입력 가사 + 송폼을 합쳐 최종 정렬된 섹션 배열 반환
function getOrderedSections() {
  const raw = document.getElementById('inputArea').value;
  const sections = parseSections(raw);
  const form = document.getElementById('songFormInput').value.trim();
  const statusEl = document.getElementById('songFormStatus');

  if (!form) {
    if (statusEl) { statusEl.textContent = ''; statusEl.className = 'songform-status'; }
    return sections;
  }

  // A-A-B-C / A A B C / A,A,B,C 모두 허용
  const tokens = form.split(/[\s\-,>·]+/).map(t => t.replace(/[<>]/g, '').trim()).filter(Boolean);
  const ordered = [];
  const missing = [];

  tokens.forEach(tok => {
    const sec = findSectionByToken(sections, tok);
    if (sec) ordered.push(sec);
    else if (!missing.includes(tok)) missing.push(tok);
  });

  if (statusEl) {
    if (missing.length) {
      statusEl.textContent = `‘${missing.join(', ')}’ 섹션을 찾을 수 없어요`;
      statusEl.className = 'songform-status warn';
    } else {
      statusEl.textContent = `${ordered.length}개 순서로 정렬됨`;
      statusEl.className = 'songform-status ok';
    }
  }

  return ordered.length ? ordered : sections;
}

function parse() {
  const raw = document.getElementById('inputArea').value;
  const linesPerSlide = parseInt(document.getElementById('lineCount').value);
  if (!raw.trim()) { showEmpty(); return; }
  const sections = getOrderedSections();
  if (sections.length === 0) { showEmpty(); return; }
  renderSections(sections, linesPerSlide);
}

function chunkLines(lines, n) {
  const chunks = [];
  for (let i = 0; i < lines.length; i += n) chunks.push(lines.slice(i, i+n));
  return chunks;
}

function renderSections(sections, linesPerSlide) {
  const out = document.getElementById('outputArea');
  out.innerHTML = '';

  let totalSlides = 0;
  let totalLines = 0;

  sections.forEach((sec, si) => {
    const slides = sectionSlides(sec, linesPerSlide);
    totalSlides += slides.length;
    totalLines += sec.groups.reduce((a, g) => a + g.length, 0);

    const block = document.createElement('div');
    block.className = 'section-block';

    // Header
    const head = document.createElement('div');
    head.className = 'section-head';

    const label = document.createElement('div');
    label.className = `section-label ${sec.type}`;
    label.textContent = sec.label;

    const actions = document.createElement('div');
    actions.className = 'section-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy-section';
    copyBtn.textContent = '복사';
    copyBtn.onclick = () => copySection(sec, linesPerSlide, copyBtn);

    actions.appendChild(copyBtn);
    head.appendChild(label);
    head.appendChild(actions);
    block.appendChild(head);

    // Slides
    const slideGroup = document.createElement('div');
    slideGroup.className = 'slide-group';

    slides.forEach((chunk, ci) => {
      const slide = document.createElement('div');
      slide.className = 'slide';

      const num = document.createElement('div');
      num.className = 'slide-num';
      num.textContent = `${ci+1}/${slides.length}`;
      slide.appendChild(num);

      chunk.forEach((line, li) => {
        const p = document.createElement('div');
        p.className = 'slide-line';
        p.textContent = line;
        slide.appendChild(p);

        if (li < chunk.length - 1) {
          const hr = document.createElement('hr');
          hr.className = 'slide-divider';
          slide.appendChild(hr);
        }
      });

      slideGroup.appendChild(slide);
    });

    block.appendChild(slideGroup);
    out.appendChild(block);
  });

  // Stats
  document.getElementById('statSections').textContent = sections.length;
  document.getElementById('statSlides').textContent = totalSlides;
  document.getElementById('statLines').textContent = totalLines;
  document.getElementById('statusBar').style.display = 'flex';
}

function showEmpty() {
  document.getElementById('outputArea').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🎵</div>
      <div class="empty-text">가사를 입력하면 자동으로 정리됩니다</div>
    </div>`;
  document.getElementById('statusBar').style.display = 'none';
}

// ── COPY ──
// Word "맑은 고딕(본문) 11pt" 적용용 스타일
const FONT_FAMILY = "'Malgun Gothic','맑은 고딕',sans-serif";
const FONT_STYLE = `font-family:${FONT_FAMILY};font-size:11.0pt;line-height:1.8;`;
// Word가 본문 폰트로 인식하도록 span에 명시 (mso-bidi 포함)
const SPAN_STYLE = `font-family:${FONT_FAMILY};font-size:11.0pt;mso-fareast-font-family:'맑은 고딕';mso-bidi-font-family:'맑은 고딕';`;

function buildSectionText(sec, linesPerSlide) {
  const slides = sectionSlides(sec, linesPerSlide);
  return slides.map(chunk => chunk.join('\n')).join('\n\n');
}

function buildSectionHtml(sec, linesPerSlide) {
  const slides = sectionSlides(sec, linesPerSlide);
  const blank = `<p style="${FONT_STYLE}margin:0;"><span style="${SPAN_STYLE}">&nbsp;</span></p>`;
  return slides.map(chunk =>
    `<p style="${FONT_STYLE}margin:0;"><span style="${SPAN_STYLE}">${chunk.join('</span><br><span style="' + SPAN_STYLE + '">')}</span></p>`
  ).join('\n' + blank + '\n');
}

async function copyRich(plainText, htmlContent) {
  // Word가 인식하는 완전한 HTML 문서 형태로 래핑
  const fullHtml =
    '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:w="urn:schemas-microsoft-com:office:word">' +
    '<head><meta charset="utf-8">' +
    `<style>p{margin:0;${FONT_STYLE}} span{${SPAN_STYLE}}</style></head>` +
    `<body style="${FONT_STYLE}">${htmlContent}</body></html>`;

  // 1차: 최신 Clipboard API (HTML 서식 포함)
  if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
    try {
      const htmlBlob = new Blob([fullHtml], { type: 'text/html' });
      const textBlob = new Blob([plainText], { type: 'text/plain' });
      await navigator.clipboard.write([
        new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })
      ]);
      return true;
    } catch (err) { /* 아래 폴백으로 */ }
  }

  // 2차: writeText (plain text만)
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(plainText);
      return true;
    } catch (err) { /* 아래 폴백으로 */ }
  }

  // 3차: execCommand 폴백 (구형/비보안 컨텍스트)
  try {
    const ta = document.createElement('textarea');
    ta.value = plainText;
    ta.className = '__copyHelper';
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (err) {
    return false;
  }
}

function flashCopied(btn, defaultLabel, ok) {
  btn.textContent = ok ? '복사됨 ✓' : '실패 ✕';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = defaultLabel; btn.classList.remove('copied'); }, 1500);
}

function copySection(sec, linesPerSlide, btn) {
  const plain = buildSectionText(sec, linesPerSlide);
  const html  = buildSectionHtml(sec, linesPerSlide);
  copyRich(plain, html).then(ok => flashCopied(btn, '복사', ok));
}

function copyAll() {
  const raw = document.getElementById('inputArea').value;
  const linesPerSlide = parseInt(document.getElementById('lineCount').value);
  if (!raw.trim()) return;

  const sections = getOrderedSections();
  const allPlain = sections.map(s => buildSectionText(s, linesPerSlide)).join('\n\n');
  const sectionBlank = `<p style="${FONT_STYLE}margin:0;"><span style="${SPAN_STYLE}">&nbsp;</span></p>`;
  const allHtml  = sections.map(s => buildSectionHtml(s, linesPerSlide)).join('\n' + sectionBlank + '\n');

  const btn = document.querySelector('.btn-copy-all');
  copyRich(allPlain, allHtml).then(ok => flashCopied(btn, '전체 복사', ok));
}

// ── 파일 출력 ──
// 가사 첫 줄을 파일명으로 사용 (없으면 기본값)
function getFileName() {
  const raw = document.getElementById('inputArea').value;
  const sections = getOrderedSections();
  for (const s of sections) {
    for (const g of s.groups) {
      if (g.length && g[0].trim()) {
        return g[0].trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 40);
      }
    }
  }
  return '찬양가사';
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function flashExport(btn, label) {
  const orig = btn.textContent;
  btn.textContent = '저장됨 ✓';
  setTimeout(() => { btn.textContent = orig; }, 1500);
}

function exportTxt(btn) {
  const raw = document.getElementById('inputArea').value;
  if (!raw.trim()) return;
  const linesPerSlide = parseInt(document.getElementById('lineCount').value);
  const sections = getOrderedSections();
  const text = sections.map(s => buildSectionText(s, linesPerSlide)).join('\n\n');
  // Windows 메모장 호환을 위해 \r\n + BOM
  const blob = new Blob(['\uFEFF' + text.replace(/\n/g, '\r\n')], { type: 'text/plain;charset=utf-8' });
  downloadBlob(blob, getFileName() + '.txt');
  flashExport(btn);
}

function exportWord(btn) {
  const raw = document.getElementById('inputArea').value;
  if (!raw.trim()) return;
  const linesPerSlide = parseInt(document.getElementById('lineCount').value);
  const sections = getOrderedSections();
  const sectionBlank = `<p style="${FONT_STYLE}margin:0;"><span style="${SPAN_STYLE}">&nbsp;</span></p>`;
  const bodyHtml = sections.map(s => buildSectionHtml(s, linesPerSlide)).join('\n' + sectionBlank + '\n');

  // Word가 여는 HTML 기반 .doc 문서 (맑은 고딕 11pt)
  const docHtml =
    '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:w="urn:schemas-microsoft-com:office:word" ' +
    'xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8">' +
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View>' +
    '<w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
    '<style>' +
    `@page { margin: 2cm; }` +
    `body { ${FONT_STYLE} }` +
    `p { margin: 0; ${FONT_STYLE} }` +
    '</style></head>' +
    `<body>${bodyHtml}</body></html>`;

  const blob = new Blob(['\uFEFF' + docHtml], { type: 'application/msword;charset=utf-8' });
  downloadBlob(blob, getFileName() + '.doc');
  flashExport(btn);
}

// ── PPTX 출력 ──
function togglePptxMenu(e) {
  e.stopPropagation();
  document.getElementById('pptxMenu').classList.toggle('open');
}
// 바깥 클릭 시 메뉴 닫기
document.addEventListener('click', () => {
  document.getElementById('pptxMenu')?.classList.remove('open');
});

// PPTX용: 송폼 순서 + 항상 2줄씩 고정으로 슬라이드(줄 배열) 목록 생성
function getPptxSlides() {
  const sections = getOrderedSections();
  const slides = [];
  sections.forEach(sec => {
    for (const group of sec.groups) {
      for (let i = 0; i < group.length; i += 2) {
        slides.push(group.slice(i, i + 2)); // [line1, line2?]
      }
    }
  });
  return slides;
}

function exportPptx(mode) {
  document.getElementById('pptxMenu').classList.remove('open');

  if (typeof PptxGenJS === 'undefined') {
    alert('PPTX 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인해주세요.');
    return;
  }
  if (!document.getElementById('inputArea').value.trim()) return;

  const slides = getPptxSlides();
  if (!slides.length) return;

  const pptx = new PptxGenJS();
  pptx.defineLayout({ name: 'FHD', width: 13.333, height: 7.5 }); // 16:9
  pptx.layout = 'FHD';

  // 모드별 설정
  const isGreen = (mode === 'green');
  const bgColor = isGreen ? '00FF00' : '000000';

  slides.forEach(lineArr => {
    const slide = pptx.addSlide();
    slide.background = { color: bgColor };

    const text = lineArr.join('\n');
    slide.addText(text, {
      x: 0.5, y: 0, w: 12.333, h: 7.5,
      align: 'center',
      valign: 'middle',          // 가로세로 완전 가운데
      fontFace: 'Malgun Gothic',  // 맑은 고딕
      fontSize: 40,
      bold: true,
      color: 'FFFFFF',           // 흰 글씨
      lineSpacingMultiple: 1.3,
      // 녹색 크로마키 모드에서 글자 가독성 위해 외곽선(검정) 추가
      outline: isGreen ? { size: 1, color: '000000' } : undefined,
      shadow: isGreen ? { type: 'outer', color: '000000', blur: 3, offset: 2, angle: 45, opacity: 0.6 } : undefined
    });
  });

  const suffix = isGreen ? '_투명(녹색)' : '_검정배경';
  pptx.writeFile({ fileName: getFileName() + suffix + '.pptx' })
    .catch(() => alert('PPTX 저장 중 오류가 발생했습니다.'));
}

function clearInput() {
  document.getElementById('inputArea').value = '';
  showEmpty();
}

function insertTag(tag) {
  const ta = document.getElementById('inputArea');
  const start = ta.selectionStart;
  const val = ta.value;
  const before = val.substring(0, start);
  const after = val.substring(start);
  const newline = before && !before.endsWith('\n') ? '\n' : '';
  ta.value = before + newline + tag + '\n' + after;
  ta.focus();
  parse();
}

// ── 사용자 섹션 프리셋 (localStorage) ──
const CUSTOM_TAG_KEY = 'worshipCustomSectionTags';

function loadCustomPresets() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_TAG_KEY) || '[]'); }
  catch { return []; }
}

function saveCustomPresets(list) {
  localStorage.setItem(CUSTOM_TAG_KEY, JSON.stringify(list));
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCustomPresets() {
  const list = loadCustomPresets();
  const wrap = document.getElementById('customTagList');
  wrap.innerHTML = list.map((name, i) => `
    <span class="tag-hint tag-custom" onclick="insertTag('<${name.replace(/'/g, "\\'")}>')">
      &lt;${escapeHtml(name)}&gt;<button class="tag-del" type="button" title="프리셋 삭제" onclick="event.stopPropagation(); removePreset(${i})">×</button>
    </span>
  `).join('');
}

function addPreset() {
  const input = document.getElementById('customTagInput');
  const name = input.value.trim().replace(/^<|>$/g, '');
  if (!name) { input.focus(); return; }
  const list = loadCustomPresets();
  if (!list.includes(name)) {
    list.push(name);
    saveCustomPresets(list);
    renderCustomPresets();
  }
  input.value = '';
  input.focus();
}

function removePreset(index) {
  const list = loadCustomPresets();
  list.splice(index, 1);
  saveCustomPresets(list);
  renderCustomPresets();
}

renderCustomPresets();

// 어디서 복사하든 <...> 제거 (입력창, 출력영역, 전체 선택 모두)
document.addEventListener('copy', function(e) {
  // Copy 버튼의 execCommand 폴백(__copyHelper)은 이미 정제된 내용이므로 개입하지 않음
  if (e.target && e.target.classList && e.target.classList.contains('__copyHelper')) return;
  const selected = window.getSelection().toString();
  if (!selected) return;
  const cleaned = selected.replace(/<[^>]*>/g, '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  if (e.clipboardData) {
    e.clipboardData.setData('text/plain', cleaned);
    // HTML로 붙는 경우에도 맑은고딕 11pt 유지하며 꺾쇠 제거
    const lines = cleaned.split('\n')
      .map(l => l === '' ? '<br>' : `<span style="${SPAN_STYLE}">${l}</span>`)
      .join('<br>');
    const html =
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:w="urn:schemas-microsoft-com:office:word">' +
      '<head><meta charset="utf-8"></head>' +
      `<body style="${FONT_STYLE}"><p style="${FONT_STYLE}margin:0;">${lines}</p></body></html>`;
    e.clipboardData.setData('text/html', html);
    e.preventDefault();
  }
});

// Handle twoLineMode toggle syncing lineCount
document.getElementById('twoLineMode').addEventListener('change', function() {
  document.getElementById('lineCount').value = this.checked ? '2' : '1';
  parse();
});
document.getElementById('lineCount').addEventListener('change', function() {
  document.getElementById('twoLineMode').checked = (this.value === '2');
});

// ── 라이브러리 (localStorage) ──
const LIB_KEY = 'worshipLyricLibrary';

function libLoad() {
  try { return JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); }
  catch { return []; }
}

function libSave_() {
  // localStorage에 실제 저장
}

function libSave() {
  const title = document.getElementById('libTitleInput').value.trim();
  const lyrics = document.getElementById('inputArea').value.trim();
  const songform = document.getElementById('songFormInput').value.trim();
  if (!title) { alert('곡 제목을 입력해주세요.'); document.getElementById('libTitleInput').focus(); return; }
  if (!lyrics) { alert('가사를 입력해주세요.'); return; }

  const lib = libLoad();
  const existing = lib.findIndex(s => s.title === title);
  const entry = {
    title,
    lyrics,
    songform,
    savedAt: new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' })
  };

  if (existing >= 0) {
    if (!confirm(`"${title}" 이 이미 저장되어 있습니다. 덮어쓸까요?`)) return;
    lib[existing] = entry;
  } else {
    lib.unshift(entry); // 최신 항목이 위로
  }

  localStorage.setItem(LIB_KEY, JSON.stringify(lib));
  libRender();

  // 저장 완료 피드백
  const btn = document.querySelector('.btn-lib-save');
  btn.textContent = '저장됨 ✓';
  setTimeout(() => { btn.textContent = '저장'; }, 1500);
}

function libDelete(title) {
  if (!confirm(`"${title}" 을 삭제할까요?`)) return;
  const lib = libLoad().filter(s => s.title !== title);
  localStorage.setItem(LIB_KEY, JSON.stringify(lib));
  libRender();
}

function libLoadSong(entry) {
  document.getElementById('inputArea').value = entry.lyrics;
  document.getElementById('libTitleInput').value = entry.title;
  if (entry.songform) document.getElementById('songFormInput').value = entry.songform;
  parse();
  // 드로어 닫기
  document.getElementById('libDrawer').classList.remove('open');
  document.getElementById('btnLibOpen').textContent = '라이브러리';
}

function libRender() {
  const q = (document.getElementById('libSearch')?.value || '').trim().toLowerCase();
  const lib = libLoad();
  const filtered = q ? lib.filter(s => s.title.toLowerCase().includes(q)) : lib;
  const listEl = document.getElementById('libList');
  const countEl = document.getElementById('libCount');
  if (countEl) countEl.textContent = `${lib.length}곡 저장됨`;

  if (!lib.length) {
    listEl.innerHTML = '<div class="lib-empty">저장된 가사가 없습니다.<br>곡 제목을 입력하고 저장 버튼을 눌러주세요.</div>';
    return;
  }
  if (!filtered.length) {
    listEl.innerHTML = '<div class="lib-empty">검색 결과가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(s => `
    <div class="lib-item">
      <div class="lib-item-title" onclick='libLoadSong(${JSON.stringify(s).replace(/'/g, "&#39;")})'>${s.title}</div>
      <div class="lib-item-date">${s.savedAt || ''}</div>
      <button class="btn-lib-load" onclick='libLoadSong(${JSON.stringify(s).replace(/'/g, "&#39;")})'>불러오기</button>
      <button class="btn-lib-del" onclick="libDelete('${s.title.replace(/'/g, "\\'")}')">삭제</button>
    </div>
  `).join('');
}

function libToggle() {
  const drawer = document.getElementById('libDrawer');
  const btn = document.getElementById('btnLibOpen');
  const isOpen = drawer.classList.toggle('open');
  btn.textContent = isOpen ? '닫기' : '라이브러리';
  if (isOpen) {
    libRender();
    setTimeout(() => document.getElementById('libSearch')?.focus(), 50);
  }
}

function libExportJson() {
  const lib = libLoad();
  if (!lib.length) { alert('저장된 가사가 없습니다.'); return; }
  const blob = new Blob([JSON.stringify(lib, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '찬양가사라이브러리_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function libImportJson(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error();
      const lib = libLoad();
      let added = 0, updated = 0;
      imported.forEach(entry => {
        if (!entry.title || !entry.lyrics) return;
        const idx = lib.findIndex(s => s.title === entry.title);
        if (idx >= 0) { lib[idx] = entry; updated++; }
        else { lib.unshift(entry); added++; }
      });
      localStorage.setItem(LIB_KEY, JSON.stringify(lib));
      libRender();
      alert(`가져오기 완료: 새로 추가 ${added}곡, 업데이트 ${updated}곡`);
    } catch {
      alert('올바른 라이브러리 파일이 아닙니다.');
    }
  };
  reader.readAsText(file);
  input.value = ''; // 같은 파일 재선택 가능하도록
}
